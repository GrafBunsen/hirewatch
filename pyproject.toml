[project]
name = "hirewatch"
version = "0.1.0"
description = "Watch job listings and notify on new ones. Simple, modular, no AI."
readme = "README.md"
authors = [
    { name = "GrafBunsen" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.35.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "schedule>=1.2.2",
    "selectolax>=1.0.0",
]

[project.scripts]
hirewatch = "hirewatch.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
